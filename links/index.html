  *{box-sizing:border-box;margin:0;padding:0}

  .primario{background:var(--dourado);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.28)}

  .insta{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.55)}
  .ico{font-size:22px}
